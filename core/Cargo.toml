[package]
name = "portal_core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tiny_http = "0.12"
subtle = "2"
jni = "0.21"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
rrule = "0.14"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
